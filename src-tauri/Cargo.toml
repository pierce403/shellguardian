[package]
name = "shellguardian"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A stateless desktop guardian for NVIDIA OpenShell agents"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
openshell-bridge = { path = "../crates/openshell-bridge" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["process", "rt", "sync", "time"] }
portable-pty = "=0.9.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tauri-plugin-single-instance = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.18"
