[workspace]
members = ["crates/openshell-bridge", "src-tauri"]
exclude = ["vendor/glib"]
default-members = ["crates/openshell-bridge"]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.90"

[patch.crates-io]
glib = { path = "vendor/glib" }
